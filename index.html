<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#242428" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="WH11ED" />

    <!-- SEO -->
    <title>Warhammer 40,000 — Core Rules 11th Edition</title>
    <meta name="description" content="Bilingual (EN/RU) interactive reference for the Warhammer 40,000 11th Edition Core Rules and Event Companion — searchable, offline-capable, free." />
    <link rel="canonical" href="https://wh11ed.ru/" />
    <meta name="robots" content="index, follow, max-image-preview:large" />

    <!-- Language alternates (locale is also selectable via ?lang=ru) -->
    <link rel="alternate" hreflang="en" href="https://wh11ed.ru/" />
    <link rel="alternate" hreflang="ru" href="https://wh11ed.ru/?lang=ru" />
    <link rel="alternate" hreflang="x-default" href="https://wh11ed.ru/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="WH11ED" />
    <meta property="og:title" content="Warhammer 40,000 — Core Rules 11th Edition" />
    <meta property="og:description" content="Bilingual (EN/RU) interactive reference for the Warhammer 40,000 11th Edition Core Rules and Event Companion — searchable, offline-capable, free." />
    <meta property="og:url" content="https://wh11ed.ru/" />
    <meta property="og:image" content="https://wh11ed.ru/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="ru_RU" />

    <!-- Twitter / X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Warhammer 40,000 — Core Rules 11th Edition" />
    <meta name="twitter:description" content="Bilingual (EN/RU) interactive reference for the Warhammer 40,000 11th Edition Core Rules and Event Companion." />
    <meta name="twitter:image" content="https://wh11ed.ru/og-image.png" />

    <!-- Structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "WH11ED — Warhammer 40,000 11th Edition Core Rules",
        "url": "https://wh11ed.ru/",
        "applicationCategory": "GameApplication",
        "operatingSystem": "Any (web, installable PWA)",
        "inLanguage": ["en", "ru"],
        "isAccessibleForFree": true,
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "description": "Bilingual (EN/RU) interactive reference for the Warhammer 40,000 11th Edition Core Rules and Event Companion."
      }
    </script>
    <script>
      (function () {
        var saved = localStorage.getItem('theme');
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var theme = saved === 'light' || saved === 'dark' ? saved : (prefersDark ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
    <!-- Fonts (Inter, EB Garamond) and bootstrap-icons are self-hosted via @fontsource /
         the bootstrap-icons package and imported in src/fonts.js, so they precache for full
         offline (no external CDN). -->
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
