<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Legacy hash-URL shim: routing used to be hash-based (/#/path). Old bookmarks,
         shared links and the pre-migration OAuth callback (/#/tracker/auth-callback?code=…)
         are transparently rewritten to clean history-mode paths. Runs first so the redirect
         fires before any assets load; location.replace leaves no extra history entry. -->
    <script>
      (function () {
        var h = window.location.hash
        if (h.indexOf('#/') !== 0) return
        var s = window.location.search
        var target = h.slice(1) + (s ? (h.indexOf('?') !== -1 ? '&' + s.slice(1) : s) : '')
        window.location.replace(target)
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#242428" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="WH Rules" />

    <!-- iOS launch screens (generated by scripts/gen-ios-splash.mjs; keep in sync) -->
    <link rel="apple-touch-startup-image" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="/splash/apple-splash-750-1334.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="/splash/apple-splash-828-1792.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/splash/apple-splash-1125-2436.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/splash/apple-splash-1170-2532.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/splash/apple-splash-1179-2556.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/splash/apple-splash-1284-2778.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/splash/apple-splash-1290-2796.png" />

    <!-- SEO -->
    <!-- Bilingual title/description: the SPA overrides these per locale at runtime (useSeoMeta),
         but the raw HTML carries the Cyrillic brand (Вархаммер) + "на русском" so RU queries are
         covered even before/without JS rendering. -->
    <title>Warhammer 40,000 11 ed — правила, фракции, ростеры и трекер на русском</title>
    <meta name="description" content="Bilingual EN/RU reference for Warhammer 40,000 11th Edition — core rules, the Event Companion, faction rules and unit datasheets, plus a free army list builder (import from the GW app or New Recruit) and an offline game tracker. Searchable, installable, free. · Справочник по правилам Warhammer 40 000 (Вархаммер) 11-й редакции на русском — основные правила, миссии и стратагемы, фракции и листы данных, конструктор армейских листов (ростер-билдер) и трекер очков, бесплатно." />
    <!-- canonical + hreflang + og:url are set PER ROUTE at runtime by useSeoMeta.js
         (history routing: every deep URL serves this same file, so a static canonical
         here would wrongly point every page at "/"). Do not re-add them statically. -->
    <meta name="robots" content="index, follow, max-image-preview:large" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="WH Rules" />
    <meta property="og:title" content="Warhammer 40,000 11th Edition — Rules, Datasheets, Army List Builder &amp; Tracker" />
    <meta property="og:description" content="Bilingual EN/RU reference for Warhammer 40,000 11th Edition — core rules, the Event Companion, faction rules and unit datasheets, plus a free army list builder and an offline game tracker. Searchable, installable, free." />
    <meta property="og:image" content="%SITE_ORIGIN%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="ru_RU" />

    <!-- Twitter / X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Warhammer 40,000 11th Edition — Rules, Datasheets, Army List Builder &amp; Tracker" />
    <meta name="twitter:description" content="Bilingual EN/RU reference for Warhammer 40,000 11th Edition — core rules, the Event Companion, faction rules and unit datasheets, plus a free army list builder and an offline game tracker." />
    <meta name="twitter:image" content="%SITE_ORIGIN%/og-image.png" />

    <!-- Structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "%SITE_ORIGIN%/#website",
            "name": "WH Rules",
            "alternateName": ["Warhammer 40,000 11th Edition — Rules, Factions & Tracker", "Вархаммер 40000 — правила 11-й редакции на русском"],
            "url": "%SITE_ORIGIN%/",
            "inLanguage": ["en", "ru"],
            "description": "Bilingual EN/RU reference for the Warhammer 40,000 11th Edition Core Rules, Event Companion, faction rules and unit datasheets, with an army list builder and a game tracker."
          },
          {
            "@type": "WebApplication",
            "name": "WH Rules — Warhammer 40,000 11th Edition rules, datasheets, army list builder & tracker",
            "url": "%SITE_ORIGIN%/",
            "isPartOf": { "@id": "%SITE_ORIGIN%/#website" },
            "applicationCategory": "GameApplication",
            "operatingSystem": "Any (web, installable PWA)",
            "inLanguage": ["en", "ru"],
            "isAccessibleForFree": true,
            "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
            "description": "Bilingual EN/RU interactive reference for the Warhammer 40,000 11th Edition Core Rules, Event Companion, faction rules and unit datasheets, with a free army list builder and an offline game tracker.",
            "featureList": [
              "Core Rules and Event Companion, searchable in English and Russian",
              "Faction rules, detachments and unit datasheets",
              "Army list builder with Munitorum Field Manual points, import from the Warhammer 40,000 app and New Recruit",
              "Offline two-player game tracker"
            ]
          }
        ]
      }
    </script>
    <script>
      (function () {
        var saved = localStorage.getItem('theme');
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var theme = saved === 'light' || saved === 'dark' ? saved : (prefersDark ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
    <!-- Fonts (Inter, EB Garamond) and bootstrap-icons are self-hosted via @fontsource /
         the bootstrap-icons package and imported in src/fonts.js, so they precache for full
         offline (no external CDN). -->
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
